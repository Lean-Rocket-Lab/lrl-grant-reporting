name: Nightly profiles (tag resources + people)

# Backstop for the Profile pipeline (/api/profile-sync, fired by the GHL "Profile Changed" workflow).
#
# 2026-10-23: Resources moved onto the Profiles object (profile_type = resource;
# docs/sprints/profiles-resources-merge.md). Both taggers now run over custom_objects.profiles, each
# behind its own gate (resource-tagger: Resource + Approved/Published; profile-tagger: Person +
# Approved/Published + Team/EIR). Both are equality-guarded with a derived rationale, so an
# unchanged profile re-tags to zero writes.
#
# The Wix Resources sync step was REMOVED: Zach froze Wix on 2026-10-23 until the new site launches
# (the "Resources → Wix Resources" mapping set is disabled in Postgres too).
#
# 08:45 UTC, after nightly-readiness (08:30) so the two AI sweeps don't overlap.

on:
  schedule:
    - cron: '45 8 * * *'
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GHL_TARGET: live
      GHL_MAX_RPS: 3
      GHL_API_KEY: ${{ secrets.GHL_API_KEY }}
      GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
      GHL_CUSTOM_OBJECT_ID: ${{ secrets.GHL_CUSTOM_OBJECT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Tag resource profiles (apply, live)
        run: npx vite-node scripts-ts/resources-tag-run.ts --apply --yes

      - name: Tag person profiles (apply, live)
        if: always()
        run: npx vite-node scripts-ts/profiles-tag-run.ts --apply --yes

      - name: Upload profiles report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profiles-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
