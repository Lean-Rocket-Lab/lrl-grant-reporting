name: Nightly activity ingest (backstop)

# Backstop for activity ingestion. Five nightly workflows existed and NONE of them ingested
# activities, so capture depended entirely on a GHL webhook firing or someone running a script by
# hand. The 2026-08-27 incident showed why that is not good enough: GHL paused the "Contact Changed"
# workflow after a storm of failures, and a paused workflow is silent. Reporting data cannot depend
# on a delivery mechanism that can switch itself off.
#
# 22:10 UTC (6:10pm EDT) — the end of the work day, so a meeting held this afternoon is written up
# THIS evening instead of tomorrow morning. Still comfortably after nightly-reconcile (07:00), which
# keeps contact↔company links in step: activity ingestion resolves a company through
# `contact.businessId`, so a contact reconciled this morning is resolvable tonight.
#
# Both steps are idempotent: identity is (source, source_record_id) and `upsertActivity` diffs before
# writing, so a clean night reports all `noop` and writes nothing. Re-running is always safe.
#
# ── WHAT THIS DELIBERATELY DOES *NOT* SWEEP ────────────────────────────────────────────────────────
#
# FORMS — both kinds are excluded, for different reasons, and neither is an oversight:
#
#   • metrics — the activity's identity is `<contactId>:<reportingPeriodEnd>`, and the reporting
#     period is derived from WHEN THE FORM WAS SUBMITTED. A sweep only knows "now", so it would file
#     a client's March answers under the period the sweep happens to run in. That is a wrong number
#     that looks entirely plausible, which is the failure mode this project treats as worst. Metrics
#     needs the webhook (which knows the submission moment) or an explicit
#     `form-ingest-run.ts metrics --submitted <date>`.
#
#   • grant — the form resolves the contact's Direct Grants opportunity to decide which grant record
#     to merge onto. A contact's grant fields hold only their LATEST application, so once anyone
#     receives a second grant, a nightly sweep would merge the new application's numbers onto
#     whichever opportunity it resolves — potentially overwriting the first grant's detail. No
#     contact has two grants today, so this is a standing hazard rather than a live bug, and grants
#     are the one type whose capture design is still open (see docs/sprints/grant-definitions.md).
#     Sweeping them nightly would bake in a decision we have deliberately not made.
#
# Both stay manual, dry-run first, until their capture path is settled.

on:
  schedule:
    # 22:10 UTC = 6:10pm EDT. Cron is UTC and does NOT follow DST, so this becomes 5:10pm EST in
    # November. That drift is deliberate rather than worth chasing: the look-back window is 7 DAYS,
    # so the exact firing time only decides how soon a meeting is written up, never whether it is.
    #
    # MOVED FROM 09:15 UTC (2026-09-17, Zach): a morning run writes up YESTERDAY, so a meeting at
    # 2:30pm was not in GHL until the following day. After the work day it catches the same day.
    #
    # ⚠️ GitHub schedules are BEST EFFORT and this repo has MEASURED the delay twice: ~4–4.5h on
    # 9/04–9/05, and 4h59m on 9/16 (scheduled 09:15 UTC, the opportunity-ingest step's change_log
    # rows land at 14:14). So treat 6:10pm as the EARLIEST it runs, not as a clock. Even a 5h slip
    # puts it at 11pm ET, which is still overnight — that is the whole point of the evening slot.
    - cron: '10 22 * * *'
    # BACKSTOP, 04:10 UTC = 12:10am EDT. Not for timing — for the case GitHub DROPS a scheduled run
    # entirely, which it does under heavy load and does silently. A dropped evening run would mean
    # nobody sees yesterday's notes when they check in the morning, which is the exact failure this
    # schedule exists to prevent. Deferred by the same ~5h this still lands ~5am ET, before anyone
    # looks. The 7-day window means it re-covers the same day the evening run did, and both passes
    # are idempotent — if the evening run worked, this one writes NOTHING and reports all `noop`.
    - cron: '10 4 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Appointment look-back window in days'
        required: false
        default: '7'

jobs:
  activities:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Zoom AI Companion summaries → appointment notes (apply, live)
        # FIRST, before the ingest below — §2 of docs/sprints/zoom-notes-appointments.md. The note
        # lands on the appointment, then the appointment is ingested, so the activity is built from a
        # record that already carries its summary rather than picking it up a night later.
        #
        # continue-on-error: notes are an ENHANCEMENT; activity ingestion is the reporting backbone.
        # A Zoom outage, an expired credential or a missing secret must never stop appointments and
        # opportunities from being ingested — and without this flag it would, because the script
        # exits 2 on absent credentials and a failed step ends the job. Read the step's own status.
        #
        # Idempotent: the ledger stores a body HASH, so an unchanged summary makes ZERO HTTP calls.
        # A clean night prints all `noop`. `updated` on appointments nobody touched means the hash
        # guard is broken — that is the signal to read, not the exit code.
        continue-on-error: true
        run: npx vite-node scripts-ts/zoom-notes-run.ts --days ${{ github.event.inputs.days || '7' }} --apply
        env:
          GHL_TARGET: live
          GHL_MAX_RPS: 3
          GHL_API_KEY: ${{ secrets.GHL_API_KEY }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          GHL_CUSTOM_OBJECT_ID: ${{ secrets.GHL_CUSTOM_OBJECT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ZOOM_ACCOUNT_ID: ${{ secrets.ZOOM_ACCOUNT_ID }}
          ZOOM_CLIENT_ID: ${{ secrets.ZOOM_CLIENT_ID }}
          ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}

      - name: Appointments → Intake / TA (apply, live)
        # A 7-day window, not one: it has to cover a webhook that was down for a few days, and a
        # re-ingested appointment is a noop. Only calendars WITH a routing rule are read, so
        # personal calendars are never touched (they are used for vendor and partner calls).
        # Cancelled and not-yet-held appointments are skipped as first-class outcomes, not errors.
        run: npx vite-node scripts-ts/appointment-ingest-run.ts --days ${{ github.event.inputs.days || '7' }} --apply
        env:
          GHL_TARGET: live
          GHL_MAX_RPS: 3
          GHL_API_KEY: ${{ secrets.GHL_API_KEY }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          GHL_CUSTOM_OBJECT_ID: ${{ secrets.GHL_CUSTOM_OBJECT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Opportunity stages → Program acceptance / Grant status (apply, live)
        # Backstop for the "Opportunity Stage changed" webhook. Enrollment dates use onlyIfAbsent,
        # so a sweep can never push an existing enrollment's start date forward — the failure that
        # live testing caught during phase 4.
        run: npx vite-node scripts-ts/opportunity-ingest-run.ts --apply
        env:
          GHL_TARGET: live
          GHL_MAX_RPS: 3
          GHL_API_KEY: ${{ secrets.GHL_API_KEY }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          GHL_CUSTOM_OBJECT_ID: ${{ secrets.GHL_CUSTOM_OBJECT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Upload activity ingest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activity-ingest-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
